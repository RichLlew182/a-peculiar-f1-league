name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild daily so the bundled fallback snapshot stays close to your sheet.
  # (The live site already re-reads the sheet in the browser; this only refreshes the fallback.)
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Pull the latest published CSVs into the bundle. If Google is unreachable the
      # committed snapshot is used instead, so this never fails the deploy.
      - name: Refresh data snapshot
        run: npm run snapshot
        continue-on-error: true

      - run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
